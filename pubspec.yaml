name: civic_id
description: "Digital ID for south African"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^10.3.10
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8

  # Compatible with Flutter 3.41.x / Dart 3.11.x
  camera: ^0.12.0+2
  pdfrx: ^2.4.8
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/civicid_icon.png"
  min_sdk_android: 21

  web:
    generate: true
    image_path: "assets/images/civicid_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#08783E"

  windows:
    generate: true
    image_path: "assets/images/civicid_icon.png"
    icon_size: 48
