spring.application.name=CivicID Backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${CIVICID_DB_URL:jdbc:mysql://localhost:3306/civicid?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${CIVICID_DB_USERNAME:civicid_app}
spring.datasource.password=${CIVICID_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=CivicID Backend
info.app.version=0.1.0

civicid.security.jwt-secret=${CIVICID_JWT_SECRET}
civicid.security.jwt-expiration-minutes=${CIVICID_JWT_EXPIRATION_MINUTES:120}
civicid.storage.root=${CIVICID_STORAGE_PATH:uploads}
civicid.bootstrap.admin-enabled=${CIVICID_BOOTSTRAP_ADMIN_ENABLED:false}
civicid.bootstrap.admin-email=${CIVICID_BOOTSTRAP_ADMIN_EMAIL:admin@civicid.local}
civicid.bootstrap.admin-password=${CIVICID_BOOTSTRAP_ADMIN_PASSWORD:}
